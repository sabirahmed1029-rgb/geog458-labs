
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seattle Elevation and Rivers</title>

  <link rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.css">

  <style>
    body {
      margin: 0;
      font: 14px/1.5 Arial, sans-serif;
      color: #182e3a;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #panel {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 16px;
      width: 260px;
      max-width: calc(100% - 100px);
      background: white;
      max-height: calc(100% - 80px);
      overflow: auto;
      border-radius: 6px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    p {
      margin: 8px 0;
    }

    .ramp {
      height: 14px;
      background: linear-gradient(
        to right,
        #ffffb2,
        #fecc5c,
        #fd8d3c,
        #f03b20,
        #bd0026
      );
      border-radius: 3px;
    }

    .values {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <section id="panel">
    <h1>Seattle Elevation and Rivers</h1>

    <p>
      Data: USGS 3DEP elevation and King County rivers and streams.
    </p>

    <p id="status">Loading map...</p>

    <div id="surface-control" hidden>
      <label>
        <input id="show-surface" type="checkbox" checked>
        Show elevation
      </label>
    </div>

    <div id="legend" hidden>
      <p><strong>Elevation (meters)</strong></p>
      <div class="ramp"></div>
      <div class="values">
        <span>Lower</span>
        <span>Middle</span>
        <span>Higher</span>
      </div>
      <p>Colors represent elevation. Blue lines show rivers and streams.</p>
    </div>
  </section>

    <script type="module">
      import * as maplibregl from
        'https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';

      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {},
          layers: [{
            id: 'background',
            type: 'background',
            paint: {
              'background-color': '#edf1f0'
            }
          }]
        },
        center: [-122.3321, 47.6062],
        zoom: 10,
        minZoom: 8,
        maxZoom: 12,
        maxBounds: [
          [-122.75, 47.10],
          [-122.05, 48.15]
        ]
      });

      map.addControl(new maplibregl.NavigationControl());
      map.addControl(
        new maplibregl.ScaleControl({ unit: 'metric' })
      );

      const status = document.getElementById('status');

      map.on('error', (event) => {
        status.textContent =
          'Map error: check the browser Console and file paths.';
        console.error(event.error);
      });

      map.on('load', () => {
        // Basemap
        map.addSource('basemap-tiles', {
          type: 'raster',
          tiles: [
            'assets/mapbox-independent/{z}/{x}/{y}.png'
          ],
          tileSize: 256,
          scheme: 'xyz',
          minzoom: 8,
          maxzoom: 12,
          bounds: [-122.75, 47.10, -122.05, 48.15],
          attribution:
            '© Mapbox © OpenStreetMap contributors'
        });

        map.addLayer({
          id: 'basemap',
          type: 'raster',
          source: 'basemap-tiles',
          paint: {
            'raster-opacity': 1,
            'raster-fade-duration': 0
          }
        });

        // Elevation raster
        map.addSource('elevation-tiles', {
          type: 'raster',
          tiles: [
            'assets/elevation/{z}/{x}/{y}.png'
          ],
          tileSize: 256,
          scheme: 'xyz',
          minzoom: 8,
          maxzoom: 12,
          bounds: [-122.75, 47.10, -122.05, 48.15],
          attribution: 'Elevation: USGS 3DEP'
        });

        map.addLayer({
          id: 'elevation-surface',
          type: 'raster',
          source: 'elevation-tiles',
          paint: {
            'raster-opacity': 0.7,
            'raster-fade-duration': 0
          }
        });

        document.getElementById('surface-control').hidden = false;
        document.getElementById('legend').hidden = false;

        document.getElementById('show-surface')
          .addEventListener('change', (event) => {
            map.setLayoutProperty(
              'elevation-surface',
              'visibility',
              event.target.checked ? 'visible' : 'none'
            );

            document.getElementById('legend').hidden =
              !event.target.checked;
          });

        // Rivers and streams
        map.addSource('river-data', {
          type: 'geojson',
          data: 'data/rivers.geojson'
        });

        map.addLayer({
          id: 'rivers',
          type: 'line',
          source: 'river-data',
          paint: {
            'line-color': '#1687d9',
            'line-width': 1.5,
            'line-opacity': 0.9
          }
        });

        // River information popup
        map.on('click', 'rivers', (event) => {
          const feature = event.features[0];
          const properties = feature.properties;

          const popupContent = document.createElement('div');

          const watershed = document.createElement('p');
          watershed.textContent =
            'Watershed: ' +
            (properties.WTRSHD_NAME || 'Unknown');

          const basin = document.createElement('p');
          basin.textContent =
            'Basin: ' +
            (properties.BASIN_NAME || 'Unknown');

          popupContent.append(watershed, basin);

          new maplibregl.Popup()
            .setLngLat(event.lngLat)
            .setDOMContent(popupContent)
            .addTo(map);
        });

        map.on('mouseenter', 'rivers', () => {
          map.getCanvas().style.cursor = 'pointer';
        });

        map.on('mouseleave', 'rivers', () => {
          map.getCanvas().style.cursor = '';
        });

        status.textContent =
          'Click a river or stream to view its watershed and basin.';
      });
    </script>
  </body>
  </html>
